<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icons/coffee-cup.svg" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <title>Coffee House</title>
</head>

<body>
    <header class="header">
        <div class="wrapper header__wrapper">
            <a href="index.html">
                <img class="header__logo" src="assets/icons/logo.svg" alt="logo">
            </a>
            <nav class="header__navigation">
                <ul class="navigation">
                    <li class="navigation__item"><a href="#favorite-coffee" class="header__link">Favorite coffee</a>
                    </li>
                    <li class="navigation__item"><a href="#about" class="header__link">About</a></li>
                    <li class="navigation__item"><a href="#mobile-app" class="header__link">Mobile app</a></li>
                    <li class="navigation__item"><a href="#contact-us" class="header__link">Contact us</a></li>
                </ul>
            </nav>
            <div class="header__actions">
                <button class="theme-switch" type="button">
                    <span class="theme-switch__item theme-switch__item_active">
                        <img src="assets/icons/sun.svg" alt="Light theme" class="theme-switch__icon">
                    </span>
                    <span class="theme-switch__item">
                        <img src="assets/icons/moon.svg" alt="Dark theme"
                            class="theme-switch__icon theme-switch__icon_default">

                        <img src="assets/icons/moon-light.svg" alt=""
                            class="theme-switch__icon theme-switch__icon_hover">
                    </span>
                </button>
                <a href="catalog.html" class="header__link">Menu<img src="assets/icons/coffee-cup.svg" alt="coffee-cup"
                        class="header__icon"></a>
            </div>
        </div>

    </header>
    <main></main>
    <footer></footer>

</body>

</html>
